[project]
name = "comfyui-media-toolbox"
version = "1.0.0"
description = "Audio and video loading / format conversion nodes for ComfyUI. Exports multiple formats in one run, supports long-media truncation, zero-re-encoding passthrough, and platform compliance checks. Reads and writes only inside the ComfyUI input/output directories."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["comfyui", "comfyui-custom-nodes", "audio", "video", "format-conversion", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.urls]
Repository = "https://github.com/jesse890423/comfyui_media_toolbox"
Issues = "https://github.com/jesse890423/comfyui_media_toolbox/issues"

[tool.comfy]
PublisherId = "jesse890423"
DisplayName = "Media Toolbox"
Icon = ""
