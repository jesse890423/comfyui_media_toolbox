[project]
name = "comfyui-media-toolbox"
version = "1.0.0"
description = "音频 / 视频加载与格式转换的 ComfyUI 自定义节点，全中文界面，支持绝对路径加载、一次多格式转换与长媒体截断"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["comfyui", "comfyui-custom-nodes", "audio", "video", "format-conversion", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.urls]
Repository = "https://github.com/jesse890423/comfyui_media_toolbox"
Issues = "https://github.com/jesse890423/comfyui_media_toolbox/issues"

[tool.comfy]
PublisherId = "jesse890423"
DisplayName = "音视频工具箱"
Icon = ""
